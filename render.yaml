services:
  # Web Service (Node.js App)
  - type: web
    name: openai-microservice
    runtime: node
    plan: free
    repo: https://github.com/render-examples/express-hello-world # Placeholder, will be auto-detected if in root
    region: oregon 
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: openai-redis
          property: connectionString
      - key: PORT
        value: 10000
      - key: MOCK_OPENAI
        value: true
    # The following must be added manually in Render Dashboard or Env Group
    # - MONGODB_URI
    # - OPENAI_API_KEY
    # - JWT_SECRET

  # Redis Service
  - type: redis
    name: openai-redis
    region: oregon
    plan: free
    ipAllowList: [] # Allow all internal connections
    maxmemoryPolicy: allkeys-lfu
